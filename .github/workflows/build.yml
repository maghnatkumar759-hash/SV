name: Build SV Video Editor
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create SV Project
        run: |
          flutter create --org com.sv.editor sv_app
          cd sv_app
          flutter pub add video_player image_picker ffmpeg_kit_flutter_full path_provider flutter_secure_storage

      - name: Setup App Manifest
        run: |
          cat << 'EOF' > sv_app/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <application
                  android:label="SV"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:extractNativeLibs="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Setup Editor Code
        run: |
          cat << 'EOF' > sv_app/lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:video_player/video_player.dart';
          import 'package:ffmpeg_kit_flutter_full/ffmpeg_kit.dart';
          import 'package:ffmpeg_kit_flutter_full/return_code.dart';
          import 'package:path_provider/path_provider.dart';

          void main() {
            runApp(const MaterialApp(
              title: 'SV',
              home: SVEditor(),
              debugShowCheckedModeBanner: false,
            ));
          }

          class SVEditor extends StatefulWidget {
            const SVEditor({super.key});

            @override
            State<SVEditor> createState() => _SVEditorState();
          }

          class _SVEditorState extends State<SVEditor> {
            File? _selectedVideo;
            VideoPlayerController? _controller;
            final ImagePicker _picker = ImagePicker();

            RangeValues _trimRange = const RangeValues(0, 10);
            double _videoDuration = 10;
            bool _isProcessing = false;
            String _statusMessage = "";

            Future<void> _pickVideo() async {
              final XFile? file = await _picker.pickVideo(source: ImageSource.gallery);
              if (file != null) {
                _controller?.dispose();
                final videoFile = File(file.path);
                final controller = VideoPlayerController.file(videoFile);
                await controller.initialize();

                setState(() {
                  _selectedVideo = videoFile;
                  _controller = controller;
                  _videoDuration = controller.value.duration.inSeconds.toDouble();
                  _trimRange = RangeValues(0, _videoDuration > 10 ? 10 : _videoDuration);
                  _statusMessage = "Loaded (${_videoDuration.toStringAsFixed(1)}s)";
                });
                controller.play();
              }
            }

            Future<void> _exportTrimmedVideo() async {
              if (_selectedVideo == null) return;

              setState(() {
                _isProcessing = true;
                _statusMessage = "Rendering video safely...";
              });

              final tempDir = await getTemporaryDirectory();
              final outputPath = '${tempDir.path}/sv_${DateTime.now().millisecondsSinceEpoch}.mp4';
              final start = _trimRange.start.toInt();
              final duration = (_trimRange.end - _trimRange.start).toInt();

              final ffmpegCommand = '-ss $start -i "${_selectedVideo!.path}" -t $duration -c:v libx264 -preset ultrafast -c:a aac "$outputPath"';

              await FFmpegKit.executeAsync(ffmpegCommand, (session) async {
                final returnCode = await session.getReturnCode();
                setState(() {
                  _isProcessing = false;
                });

                if (ReturnCode.isSuccess(returnCode)) {
                  setState(() {
                    _statusMessage = "Export Complete!\nSaved to: $outputPath";
                  });
                } else {
                  setState(() {
                    _statusMessage = "Export Failed.";
                  });
                }
              });
            }

            @override
            void dispose() {
              _controller?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF111111),
                appBar: AppBar(
                  backgroundColor: Colors.black,
                  title: const Text('SV Editor', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                  actions: [
                    if (_selectedVideo != null)
                      TextButton(
                        onPressed: _isProcessing ? null : _exportTrimmedVideo,
                        child: const Text('Export', style: TextStyle(color: Colors.blueAccent, fontWeight: FontWeight.bold)),
                      )
                  ],
                ),
                body: Column(
                  children: [
                    Expanded(
                      child: Center(
                        child: _controller != null && _controller!.value.isInitialized
                            ? AspectRatio(
                                aspectRatio: _controller!.value.aspectRatio,
                                child: VideoPlayer(_controller!),
                              )
                            : const Text('Select video to edit in SV', style: TextStyle(color: Colors.white54)),
                      ),
                    ),
                    if (_isProcessing)
                      const Padding(
                        padding: EdgeInsets.all(16.0),
                        child: CircularProgressIndicator(color: Colors.blueAccent),
                      ),
                    if (_selectedVideo != null) ...[
                      Text(_statusMessage, style: const TextStyle(color: Colors.grey, fontSize: 12), textAlign: TextAlign.center),
                      const SizedBox(height: 10),
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 20),
                        child: RangeSlider(
                          values: _trimRange,
                          min: 0,
                          max: _videoDuration > 0 ? _videoDuration : 1,
                          activeColor: Colors.blueAccent,
                          inactiveColor: Colors.white24,
                          onChanged: (RangeValues values) {
                            setState(() {
                              _trimRange = values;
                            });
                            _controller?.seekTo(Duration(seconds: values.start.toInt()));
                          },
                        ),
                      ),
                      const SizedBox(height: 20),
                    ]
                  ],
                ),
                floatingActionButton: FloatingActionButton(
                  backgroundColor: Colors.blueAccent,
                  onPressed: _pickVideo,
                  child: const Icon(Icons.add, color: Colors.white),
                ),
              );
            }
          }
          EOF

      - name: Build Release APK
        run: |
          cd sv_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SV-Release-APK
          path: sv_app/build/app/outputs/flutter-apk/app-release.apk
